name: Release Dry-Run

on:
  push:
    branches: [main]

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci --ignore-scripts
      - run: npm run build:types
      - run: npm pack --dry-run
